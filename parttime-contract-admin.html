<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>알바 계약서 제출 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f5f6f8;--card:#fff;--text:#17191c;--muted:#6e747c;--line:#e3e6ea;--primary:#111827;--danger:#c83d3d;--success:#177245;--radius:16px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}
    .shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:36px 0 64px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.title{margin:0;font-size:clamp(24px,3vw,34px);letter-spacing:-.04em}.sub{margin:7px 0 0;color:var(--muted);font-size:13px}.chip{padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:12px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 3px 16px rgba(16,24,40,.03)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}.search{width:min(430px,100%);height:44px;border:1px solid var(--line);border-radius:10px;padding:0 13px}.right{display:flex;align-items:center;gap:10px}.count{color:var(--muted);font-size:12px}.btn{border:0;border-radius:9px;padding:10px 14px;background:#eef1f5;color:var(--text);cursor:pointer;font-weight:700}
    .list{display:grid;gap:12px}.item{border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:14px;align-items:center;padding:15px 16px;background:#fbfcfd;cursor:pointer}.head strong{font-size:14px}.meta{color:var(--muted);font-size:11px;margin-bottom:3px}.pill{justify-self:end;padding:6px 9px;border-radius:999px;background:#edf8f1;color:var(--success);font-size:11px;font-weight:700}.body{display:none;padding:17px 16px 18px;border-top:1px solid var(--line)}.item.open .body{display:block}
    .details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:15px}.detail{border:1px solid var(--line);border-radius:9px;padding:12px}.label{color:var(--muted);font-size:11px;margin-bottom:5px}.value{font-size:14px;font-weight:700;word-break:break-word}.docs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.doc{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px;text-align:left;cursor:pointer;font-size:12px}.doc:hover{background:#f7f8fa}.doc:disabled{opacity:.4;cursor:not-allowed}.empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:13px}.error{margin-top:14px;color:var(--danger);font-size:12px;line-height:1.6;white-space:pre-line}.blocked{padding:52px 20px;text-align:center}.blocked h2{margin:0 0 9px;font-size:20px}.blocked p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
    @media(max-width:900px){.head{grid-template-columns:1fr 1fr}.pill{justify-self:start}.details{grid-template-columns:1fr 1fr}.docs{grid-template-columns:1fr 1fr}}@media(max-width:620px){.shell{width:min(100% - 22px,1180px);padding-top:22px}.topbar{align-items:flex-start;flex-direction:column}.card{padding:16px}.head,.details,.docs{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="shell">
  <div class="topbar">
    <div><h1 class="title">계약서 제출 관리자</h1><p class="sub">제출자 정보 및 첨부서류 확인</p></div>
    <div class="chip" id="adminChip">관리자 확인 중...</div>
  </div>

  <section class="card" id="adminPanel" hidden>
    <div class="toolbar">
      <input class="search" id="search" type="search" placeholder="이름, 전화번호, 이메일, 역 이름 검색" />
      <div class="right"><span class="count" id="count">0건</span><button class="btn" id="refresh">새로고침</button></div>
    </div>
    <div class="list" id="list"></div>
    <div class="error" id="error"></div>
  </section>

  <section class="card blocked" id="blockedPanel">
    <h2 id="blockedTitle">관리자 권한 확인 중</h2>
    <p id="blockedText">로그인 정보와 관리자 권한을 확인하고 있습니다.</p>
  </section>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
  import { getStorage, ref, getBlob } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js";

  const firebaseConfig={apiKey:"AIzaSyA8TzpsxBZTTgK_kdqZcvp6J-Ot2_golxM",authDomain:"flyingcenter.firebaseapp.com",projectId:"flyingcenter",storageBucket:"flyingcenter.firebasestorage.app",messagingSenderId:"266507809827",appId:"1:266507809827:web:68a34917671e839ec46d96"};
  const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app),$=id=>document.getElementById(id);
  const FILES=[
    {key:"residenceFront",label:"재류카드 앞면"},{key:"residenceBack",label:"재류카드 뒷면"},
    {key:"designation",label:"지정서"},{key:"passport",label:"여권 사본"},{key:"visaPhoto",label:"비자 사진"}
  ];
  let rows=[];

  function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
  function fmt(ts){if(!ts)return"-";try{const d=ts.toDate?ts.toDate():new Date(ts);return new Intl.DateTimeFormat("ko-KR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d)}catch{return"-"}}
  async function profile(uid){const s=await getDoc(doc(db,"shiftUsers",uid));return s.exists()?s.data():null}

  onAuthStateChanged(auth,async user=>{
    if(!user){$("adminChip").textContent="로그인 필요";$("blockedTitle").textContent="로그인이 필요합니다";$("blockedText").textContent="기존 시프트 시스템에서 관리자 계정으로 로그인한 뒤 이 페이지를 열어주세요.";return}
    try{
      const p=await profile(user.uid),isAdmin=p?.role==="admin";
      $("adminChip").textContent=`${p?.name||p?.displayName||user.email||"사용자"}${isAdmin?" · ADMIN":""}`;
      if(!isAdmin){$("blockedTitle").textContent="관리자 전용 페이지입니다";$("blockedText").textContent="현재 계정에는 관리자 권한이 없습니다.";return}
      $("blockedPanel").hidden=true;$("adminPanel").hidden=false;await load();
    }catch(err){console.error(err);$("blockedTitle").textContent="권한 확인 실패";$("blockedText").textContent="관리자 권한 정보를 불러오지 못했습니다."}
  });

  async function load(){
    $("list").innerHTML='<div class="empty">불러오는 중...</div>';$("error").textContent="";
    try{
      const s=await getDocs(collection(db,"partTimeContracts"));
      rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt?.seconds||b.submittedAt?.seconds||0)-(a.updatedAt?.seconds||a.submittedAt?.seconds||0));
      render();
    }catch(err){console.error(err);$("list").innerHTML="";$("error").textContent=`제출 내역을 불러오지 못했습니다.\n${err.code||""} ${err.message||""}`}
  }

  function render(){
    const q=$("search").value.trim().toLowerCase();
    const filtered=rows.filter(r=>!q||`${r.name||r.displayName||""} ${r.phone||""} ${r.email||""} ${r.stationName||""}`.toLowerCase().includes(q));
    $("count").textContent=`${filtered.length}건`;
    if(!filtered.length){$("list").innerHTML='<div class="empty">제출 내역이 없습니다.</div>';return}
    $("list").innerHTML=filtered.map(r=>{
      const files=r.files||{};
      return `<article class="item" data-id="${esc(r.id)}">
        <div class="head">
          <div><div class="meta">이름</div><strong>${esc(r.name||r.displayName||"이름 미등록")}</strong></div>
          <div><div class="meta">전화번호</div><strong>${esc(r.phone||"-")}</strong></div>
          <div><div class="meta">지하철 역</div><strong>${esc(r.stationName||"-")}</strong></div>
          <div><div class="meta">편도 운임</div><strong>${Number(r.oneWayFare||0).toLocaleString()}円</strong></div>
          <span class="pill">제출완료</span>
        </div>
        <div class="body">
          <div class="details">
            <div class="detail"><div class="label">이름</div><div class="value">${esc(r.name||r.displayName||"-")}</div></div>
            <div class="detail"><div class="label">전화번호</div><div class="value">${esc(r.phone||"-")}</div></div>
            <div class="detail"><div class="label">이메일</div><div class="value">${esc(r.email||"-")}</div></div>
            <div class="detail"><div class="label">지하철 역 이름</div><div class="value">${esc(r.stationName||"-")}</div></div>
            <div class="detail"><div class="label">편도 가격</div><div class="value">${Number(r.oneWayFare||0).toLocaleString()}円</div></div>
            <div class="detail"><div class="label">최근 제출</div><div class="value">${esc(fmt(r.updatedAt||r.submittedAt))}</div></div>
          </div>
          <div class="docs">${FILES.map(f=>`<button class="doc" data-row="${esc(r.id)}" data-doc="${f.key}" ${files[f.key]?.path?"":"disabled"}>${esc(f.label)} 열기</button>`).join("")}</div>
        </div>
      </article>`
    }).join("");
    document.querySelectorAll(".head").forEach(el=>el.addEventListener("click",()=>el.closest(".item").classList.toggle("open")));
    document.querySelectorAll(".doc").forEach(btn=>btn.addEventListener("click",async e=>{e.stopPropagation();await openDoc(btn.dataset.row,btn.dataset.doc,btn)}));
  }

  async function openDoc(rowId,key,btn){
    const row=rows.find(r=>r.id===rowId),info=row?.files?.[key];if(!info?.path)return;
    const original=btn.textContent;btn.disabled=true;btn.textContent="불러오는 중...";
    try{const blob=await getBlob(ref(storage,info.path)),url=URL.createObjectURL(blob);window.open(url,"_blank","noopener,noreferrer");setTimeout(()=>URL.revokeObjectURL(url),60000)}
    catch(err){console.error(err);alert(`파일을 열 수 없습니다.\n${err.code||""} ${err.message||""}`)}
    finally{btn.disabled=false;btn.textContent=original}
  }

  $("search").addEventListener("input",render);$("refresh").addEventListener("click",load);
</script>
</body>
</html>
